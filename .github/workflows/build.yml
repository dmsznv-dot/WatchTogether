name: Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The id stays 'macos-latest' (job and artifact names are used by release.yml),
          # but the runner is pinned: Homebrew bottles target the runner's macOS, and the
          # bundled libmpv must run on the app's minimumSystemVersion (15.0).
          - platform: 'macos-latest'
            runner: 'macos-15'
            args: '--bundles app --no-sign'
          - platform: 'windows-latest'
            args: '--bundles msi,nsis --config src-tauri/tauri.windows.conf.json'

    runs-on: ${{ matrix.runner || matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Monotonic version per build, so the in-app updater can tell builds apart.
      - name: Stamp app version
        shell: bash
        run: |
          echo "WT_VERSION=0.2.${{ github.run_number }}" >> "$GITHUB_ENV"
          python -c "import json,sys; p='apps/desktop/src-tauri/tauri.conf.json'; c=json.load(open(p)); c['version']=sys.argv[1]; json.dump(c,open(p,'w'),indent=2)" "0.2.${{ github.run_number }}"

      # Signing steps below run only when their secrets exist (see docs/SIGNING.md).
      - name: Detect signing secrets
        id: signing
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          has() { [ -n "$1" ] && echo true || echo false; }
          echo "updater=$(has "$UPDATER_KEY")" >> "$GITHUB_OUTPUT"
          echo "apple=$(has "$APPLE_CERTIFICATE")" >> "$GITHUB_OUTPUT"
          echo "notary=$(has "$APPLE_API_KEY")" >> "$GITHUB_OUTPUT"
          echo "windows=$(has "$WINDOWS_CERTIFICATE")" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/desktop/package-lock.json'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install mpv

      - name: Install Windows test media tools
        if: matrix.platform == 'windows-latest'
        run: choco install ffmpeg --no-progress -y

      - name: Prepare Windows libmpv
        if: matrix.platform == 'windows-latest'
        run: python scripts/setup_mpv_windows.py

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run frontend tests
        working-directory: apps/desktop
        run: npm test

      - name: Build frontend assets
        working-directory: apps/desktop
        run: npm run build

      - name: Run workspace cargo tests
        run: cargo test --workspace

      - name: Verify real decoder tracks, subtitles and 1080p60 rendering
        shell: bash
        run: |
          python scripts/create_player_fixture.py
          fixture() { python -c "from pathlib import Path; print(Path('target/player-fixtures/$1').resolve())"; }
          WT_TEST_MEDIA="$(fixture multi.mkv)" WT_TEST_HD60="$(fixture hd60.mp4)" \
            cargo test -p media-engine --test real_mpv_test -- --ignored --nocapture

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Import Windows code signing certificate
        if: matrix.platform == 'windows-latest' && steps.signing.outputs.windows == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "WT_WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build Tauri Desktop Application
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          extra=()
          # Updater artifacts need the signing key, which pull requests from forks do not get.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            extra+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          if [ -n "${WT_WINDOWS_CERT_THUMBPRINT:-}" ]; then
            extra+=(--config "{\"bundle\":{\"windows\":{\"certificateThumbprint\":\"$WT_WINDOWS_CERT_THUMBPRINT\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.digicert.com\"}}}")
          fi
          cargo tauri build ${{ matrix.args }} "${extra[@]}"

      - name: Verify Windows installer and bundled media runtime
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/smoke_windows_installer.ps1

      - name: Import Apple Developer ID certificate
        if: matrix.platform == 'macos-latest' && steps.signing.outputs.apple == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/codesign.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/codesign.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')"
          test -n "$identity"
          echo "WT_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Bundle macOS media libraries and sign
        if: matrix.platform == 'macos-latest'
        run: python3 scripts/bundle_mpv_macos.py "target/release/bundle/macos/Watch Together.app"

      - name: Notarize macOS app
        if: matrix.platform == 'macos-latest' && steps.signing.outputs.apple == 'true' && steps.signing.outputs.notary == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          app="target/release/bundle/macos/Watch Together.app"
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          rm "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose "$app"

      - name: Create DMG and updater archive
        if: matrix.platform == 'macos-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p target/release/bundle/dmg
          # hdiutil intermittently fails with "Resource busy" on hosted runners.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname "Watch Together" -srcfolder "target/release/bundle/macos/Watch Together.app" -ov -format UDZO "target/release/bundle/dmg/Watch_Together_macOS.dmg" && break
            [ "$attempt" = 5 ] && exit 1
            echo "hdiutil failed (attempt $attempt), retrying in 10 s"; sleep 10
          done
          if [ -n "${WT_CODESIGN_IDENTITY:-}" ]; then
            codesign --force --timestamp -s "$WT_CODESIGN_IDENTITY" "target/release/bundle/dmg/Watch_Together_macOS.dmg"
          fi
          # The in-app updater replaces the .app with this archive (signed for the updater).
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            mkdir -p target/release/bundle/updater
            COPYFILE_DISABLE=1 tar -czf target/release/bundle/updater/WatchTogether-macOS.app.tar.gz \
              -C target/release/bundle/macos "Watch Together.app"
            cargo tauri signer sign target/release/bundle/updater/WatchTogether-macOS.app.tar.gz > /dev/null
            test -s target/release/bundle/updater/WatchTogether-macOS.app.tar.gz.sig
          fi

      - name: Verify packaged DMG launches without Homebrew
        if: matrix.platform == 'macos-latest'
        run: ./scripts/smoke_macos_dmg.sh "target/release/bundle/dmg/Watch_Together_macOS.dmg" --hide-homebrew

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watch-together-${{ matrix.platform }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/updater/*
          if-no-files-found: warn

  # Publishes the signed builds and latest.json to the fixed "updates" release, which
  # the in-app updater checks (plugins.updater.endpoints in tauri.conf.json).
  publish-update:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.2.${{ github.run_number }}
        run: |
          set -euo pipefail
          mac="$(find artifacts -name 'WatchTogether-macOS.app.tar.gz' | head -1)"
          win="$(find artifacts -path '*nsis*' -name '*-setup.exe' | head -1)"
          if [ ! -f "$mac.sig" ] || [ ! -f "$win.sig" ]; then
            echo "::warning::Signed updater artifacts are missing; the update manifest was not published"
            exit 0
          fi
          mkdir out
          cp "$mac" out/WatchTogether-macOS.app.tar.gz
          cp "$win" out/WatchTogether-Windows-x64-Setup.exe
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/updates"
          python3 - "$mac.sig" "$win.sig" "$base" <<'PY'
          import datetime, json, os, sys
          mac_sig, win_sig, base = sys.argv[1:]
          manifest = {
              "version": os.environ["VERSION"],
              "notes": "Watch Together " + os.environ["VERSION"],
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": {"signature": open(mac_sig).read().strip(), "url": base + "/WatchTogether-macOS.app.tar.gz"},
                  "windows-x86_64": {"signature": open(win_sig).read().strip(), "url": base + "/WatchTogether-Windows-x64-Setup.exe"},
              },
          }
          json.dump(manifest, open("out/latest.json", "w"), indent=2)
          PY
          if ! gh release view updates --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create updates --repo "$GITHUB_REPOSITORY" --prerelease --title "In-app updates" \
              --notes "Signed builds for the in-app updater. To install, use the downloads in README."
          fi
          # Binaries first, manifest last: a client never sees a manifest for missing files.
          gh release upload updates out/WatchTogether-macOS.app.tar.gz out/WatchTogether-Windows-x64-Setup.exe --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload updates out/latest.json --repo "$GITHUB_REPOSITORY" --clobber
          cat out/latest.json
