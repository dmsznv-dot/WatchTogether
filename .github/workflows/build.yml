name: Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The id stays 'macos-latest' (job and artifact names are used by release.yml),
          # but the runner is pinned: Homebrew bottles target the runner's macOS, and the
          # bundled libmpv must run on the app's minimumSystemVersion (15.0).
          - platform: 'macos-latest'
            runner: 'macos-15'
            args: '--bundles app --no-sign'
          - platform: 'windows-latest'
            args: '--bundles msi,nsis --config src-tauri/tauri.windows.conf.json'

    runs-on: ${{ matrix.runner || matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/desktop/package-lock.json'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install mpv

      - name: Install Windows test media tools
        if: matrix.platform == 'windows-latest'
        run: choco install ffmpeg --no-progress -y

      - name: Prepare Windows libmpv
        if: matrix.platform == 'windows-latest'
        run: python scripts/setup_mpv_windows.py

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run frontend tests
        working-directory: apps/desktop
        run: npm test

      - name: Build frontend assets
        working-directory: apps/desktop
        run: npm run build

      - name: Run workspace cargo tests
        run: cargo test --workspace

      - name: Verify real decoder tracks, subtitles and 1080p60 rendering
        shell: bash
        run: |
          python scripts/create_player_fixture.py
          fixture() { python -c "from pathlib import Path; print(Path('target/player-fixtures/$1').resolve())"; }
          WT_TEST_MEDIA="$(fixture multi.mkv)" WT_TEST_HD60="$(fixture hd60.mp4)" \
            cargo test -p media-engine --test real_mpv_test -- --ignored --nocapture

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Tauri Desktop Application
        working-directory: apps/desktop
        run: cargo tauri build ${{ matrix.args }}

      - name: Verify Windows installer and bundled media runtime
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/smoke_windows_installer.ps1

      - name: Bundle macOS media libraries and create DMG
        if: matrix.platform == 'macos-latest'
        run: |
          python3 scripts/bundle_mpv_macos.py "target/release/bundle/macos/Watch Together.app"
          mkdir -p target/release/bundle/dmg
          # hdiutil intermittently fails with "Resource busy" on hosted runners.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname "Watch Together" -srcfolder "target/release/bundle/macos/Watch Together.app" -ov -format UDZO "target/release/bundle/dmg/Watch_Together_macOS.dmg" && break
            [ "$attempt" = 5 ] && exit 1
            echo "hdiutil failed (attempt $attempt), retrying in 10 s"; sleep 10
          done

      - name: Verify packaged DMG launches without Homebrew
        if: matrix.platform == 'macos-latest'
        run: ./scripts/smoke_macos_dmg.sh "target/release/bundle/dmg/Watch_Together_macOS.dmg" --hide-homebrew

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watch-together-${{ matrix.platform }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: warn
