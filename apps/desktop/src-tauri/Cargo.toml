[package]
name = "watch-together-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tauri 2 desktop application backend for Watch Together"

[dependencies]
shared-protocol = { workspace = true }
media-stream = { workspace = true }
sync-engine = { workspace = true }
room-server = { workspace = true }
network = { workspace = true }
media-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tauri = { version = "2", default-features = false, features = ["wry", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[build-dependencies]
tauri-build = { version = "2", default-features = false , features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

