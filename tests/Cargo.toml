[package]
name = "watch-together-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "E2E Integration and Network Test Suite for Watch Together"

[dependencies]
tokio = { version = "1.38", features = ["full", "fs", "io-util", "sync", "macros", "rt-multi-thread"] }
axum = { version = "0.7", features = ["http1", "http2", "tokio"] }
tower = { version = "0.4" }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1.6"
subtle = "2.5"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { workspace = true }
tempfile = "3.10"
tracing = "0.1"
futures-util = "0.3"

[lib]
name = "watch_together_tests"
path = "common/mod.rs"

[[test]]
name = "integration"
path = "integration/main.rs"

[[test]]
name = "media_stream_test"
path = "integration/media_stream_test.rs"

[[test]]
name = "protocol_test"
path = "integration/protocol_test.rs"

[[test]]
name = "sync_drift_test"
path = "integration/sync_drift_test.rs"

[[test]]
name = "local_player_test"
path = "integration/local_player_test.rs"

[[test]]
name = "room_lifecycle_test"
path = "integration/room_lifecycle_test.rs"

[[test]]
name = "network"
path = "network/main.rs"

[[test]]
name = "reconnect_test"
path = "network/reconnect_test.rs"
