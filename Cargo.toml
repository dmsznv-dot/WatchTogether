[workspace]
resolver = "2"
members = [
    "crates/shared-protocol",
    "crates/media-stream",
    "crates/sync-engine",
    "crates/room-server",
    "crates/network",
    "crates/media-engine",
    "services/signaling",
    "apps/desktop/src-tauri",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Watch Together Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/watch-together/watch-together"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
thiserror = "1.0"

# Dynamic Library Loading
libloading = "0.8"

# Async & Networking
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
bytes = "1.6"
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "trace"] }
http = "1.1"
async-trait = "0.1"
tokio-tungstenite = "0.24"

# Cryptography & Security
rand = "0.8"
subtle = "2.5"
sha2 = "0.10"

# Media utilities
mime_guess = "2.0"

# Logging / Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
reqwest = { version = "0.12", features = ["stream"] }
tempfile = "3.10"
tokio-test = "0.4"
proptest = "1.4"

# Workspace Internal Crates
shared-protocol = { path = "crates/shared-protocol" }
media-stream = { path = "crates/media-stream" }
sync-engine = { path = "crates/sync-engine" }
room-server = { path = "crates/room-server" }
network = { path = "crates/network" }
media-engine = { path = "crates/media-engine" }
signaling = { path = "services/signaling" }
