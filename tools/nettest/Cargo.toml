[package]
name = "wt-nettest"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
description = "Watch Together: connectivity test (iroh, no router setup)"

# Standalone: not part of the root Watch Together workspace.
[workspace]

[dependencies]
iroh = { version = "1.4", features = ["unstable-net-report"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
data-encoding = "2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
